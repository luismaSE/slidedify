name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the debug APK as a pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Version: a higher number on every run; the name comes from a v1.2.3 tag when there is one.
      - name: Version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      # Optional release key (secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD); without it release builds use the debug key.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Build debug and release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Optional repository secret; without it the APK only has the Demo provider.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          # Optional: turn on TIDAL / YouTube Music (see docs/SERVICIOS.md).
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_ENABLED }}
        # The release build runs R8 (shrinking/obfuscation): building and launching it here catches
        # missing keep rules before a user ever sees them.
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: slidedify-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: compass-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Stable download link for testing on a phone: always the latest build of this branch.
      - name: Publish debug APK (pre-release "debug-latest")
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk slidedify-debug.apk
          cp app/build/outputs/apk/release/app-release.apk compass-release.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest slidedify-debug.apk compass-release.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Slidedify debug (última versión)" \
            --notes "Build de prueba automático de ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Instalar en Android permitiendo fuentes desconocidas."

  # Opens the app on an emulator so start-up crashes are caught (and their stack trace logged).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The optimized release on one, the debug build on the other.
        include:
          - api: 34
            variant: release
          - api: 36
            variant: debug
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.variant == 'release' && 'compass-release' || 'slidedify-debug-apk' }}
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: APK=$(ls apks/*.apk apks/apk/release/*.apk 2>/dev/null | head -1) ./ci/smoke.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-logs-${{ matrix.api }}-${{ matrix.variant }}
          path: |
            logcat.txt
            smoke-*.png
          if-no-files-found: ignore

